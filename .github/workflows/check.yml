# The merge gate, on every push to main and every pull request. `suite` runs `python3 -m unittest`
# (tests/test_docs.py included; scripts/suite.sh, four processes a shard) in six shards on Python 3.11 (the floor); `mod` runs `claude
# plugin validate mod && claude plugin test mod` against the Claude Code version the mod was last
# verified with; `kernel` rebuilds the PureScript kernel with its pinned toolchain and fails when
# the committed mod/hooks/kernel.js isn't what kernel/src builds (`scripts/kernel.py check`, its
# props included), then runs its goldens under OpenCode's Bun, and rebuilds the web app's scripts
# from their TypeScript (`scripts/web.py build`, #1323), failing when the commit isn't what they
# build; `check`, the ruleset's required check, is green only when
# all three are. nightly.yml runs the suite and the mod on the newest Claude Code. The README shows
# both as badges.
#
# One serial job took 28 to 32 minutes at d80b924, its tests doubled in a day (#950), and a fifth
# of that was one test sitting out a 300 s sleep. Six shards on separate runners (WB_TEST_SHARD,
# tests/__init__.py: every sixth test, so each gets a slice of every class) took 6.5 to 10 minutes
# each by 2026-11-25, the check 9.5 to 10.5 (40 runs), one process leaving its runner's four CPUs
# half idle; so each shard runs as four processes at once (scripts/suite.sh), every test still
# once: a local shard 1/6 on four CPUs, 404 s in one process, 142 s in four.
#
# A pull request that changes only what no test reads (the README, docs/releases/, the images in
# docs/) runs tests/test_docs.py and tests/test_workflows.py, not the whole suite; main always
# runs it. No path filter on the trigger: a required check must report on every pull request.
#
# The real-OpenCode tests run against the OpenCode pinned below (OPENCODE_VERSION, installed from
# its release with the hash pinned here); opencode.yml runs them on the newest OpenCode. The Lane
# tests skip where the kernel has no Landlock: the "Landlock" step says which this runner was.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # never on main: shields.io's badge reads a cancelled run as failing, and two merges a minute
  # apart cancelled the first one's (2026-11-19)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Claude Code the mod was last verified with; the floor is in ARCHITECTURE.md, *The tests*.
  CLAUDE_CODE_VERSION: '2.1.311'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  DISABLE_TELEMETRY: '1'
  # The OpenCode the real-OpenCode tests were last verified with, and its release tarball's hash.
  OPENCODE_VERSION: '2.3.0'
  OPENCODE_SHA256: 'fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b'

jobs:
  suite:
    runs-on: ubuntu-latest
    # a shard: three to four minutes (locally, four CPUs: 157 to 222 s); a hung test fails after
    # WB_TEST_HANG_SECS, named
    timeout-minutes: 30
    strategy:
      # a failed shard leaves the others running: each names its own failures, and ship.sh reads
      # a cancelled one as failed too
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      WB_TEST_SHARD: ${{ matrix.shard }}/6
      # a hung test fails, named, and the suite goes on (tests/__init__.py, #950); 300, not the
      # nightlies' 600: the slowest test takes under 30 s, and a hang (one in the 40 runs to
      # 2026-11-25) held its pull request 10 minutes past its other shards
      WB_TEST_HANG_SECS: '300'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # a pull request's merge commit and its base: what the pull request changes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Standard library only. The floor, 3.11, not the runner's newer python3: a 3.12+ API would
      # pass on the developers' 3.14 and break 3.11 users (the 2026-11-16 audit). nightly.yml runs
      # the runner's own python3, and macOS.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python3 --version
      - name: Scope
        id: scope
        # docs: every path the pull request changes is one no test reads; else (or on main) full
        run: |
          scope=full
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD) || changed=
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" |
                grep -qvxE 'README\.md|docs/releases/[^/]+\.md|docs/[^/]+\.(png|jpe?g|gif|svg|webp)'; then
              scope=docs
            fi
          fi
          echo "scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      # The tests' repos carry their own identity; wb accept's commits in a worktree want one too.
      - run: |
          git config --global user.name "workbench CI"
          git config --global user.email "ci@invalid"
      - if: steps.scope.outputs.scope == 'full'
        run: scripts/install-opencode.sh "$OPENCODE_VERSION" "$OPENCODE_SHA256" >> "$GITHUB_PATH"
      # The Git LFS test (#382) skips without git-lfs; the runner image has it, else apt does.
      - name: Git LFS
        if: steps.scope.outputs.scope == 'full'
        run: |
          git lfs version || { sudo apt-get update -q && sudo apt-get install -yq git-lfs && git lfs version; }
      - name: Landlock
        if: steps.scope.outputs.scope == 'full'
        run: |
          python3 -c 'from workbench import lane; print("Landlock ABI", lane.abi() or "none here: the Lane tests skip")'
      # the shard in four processes, one per CPU (scripts/suite.sh): each prints its log as it ends.
      # exec: a cancel's SIGINT and SIGTERM go to the step's shell alone, which never passes them
      # on, so suite.sh was SIGKILLed with every log unprinted (its review, 2026-11-25)
      - if: steps.scope.outputs.scope == 'full'
        run: exec scripts/suite.sh "$WB_TEST_SHARD" 4
      - if: steps.scope.outputs.scope == 'docs' && matrix.shard == 1
        run: python3 -m unittest tests.test_docs tests.test_workflows

  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
      - run: claude --version
      - run: claude plugin validate mod && claude plugin test mod

  # The kernel (kernel/BOUNDARY.md, #1356): fetch the pinned purs, esbuild and packages by hash
  # into the per-user cache (cached here on both pin files), then `check`: lint, Tables against the
  # Python, two builds byte-equal to each other and to the commit, exports, budgets, the seeded props
  # (kernel/test/Props.purs, under OpenCode's Bun: installed first). Then the same
  # goldens `mod` runs on Claude Code, under OpenCode's Bun (BUN_BE_BUN, checked on 2.3.0).
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: scripts/install-opencode.sh "$OPENCODE_VERSION" "$OPENCODE_SHA256" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/workbench/kernel
          key: kernel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/toolchain.json', 'kernel/spago.lock') }}
      - run: python3 scripts/kernel.py fetch
      - run: python3 scripts/kernel.py check
      - run: BUN_BE_BUN=1 opencode test opencode-plugin/test
      # the OpenCode plugin's TypeScript, type-checked by the same Bun (`bun check`; 2.3.0's and
      # 2.4.1's have it): its env.d.ts and host.d.ts declare what it uses, so nothing is installed (#1311)
      - run: BUN_BE_BUN=1 opencode check -p opencode-plugin --no-pretty
      # The web app's scripts (#1323): workbench/chat_static/src/*.ts built again with the pinned
      # TypeScript (scripts/install-tsc.sh, by hash), strict; the committed app.js, stats.js,
      # settings.js and sw.js must be what it builds, and nothing else new beside them
      - run: python3 scripts/web.py build
      - run: git diff --exit-code -- workbench/chat_static && test -z "$(git status --porcelain -- workbench/chat_static)"

  # The ruleset's required check (.github/rulesets/main.json): one name whatever the shards are
  # called. always(): a failed or cancelled shard must fail it, not skip it, as a skip passes.
  check:
    needs: [suite, mod, kernel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SUITE: ${{ needs.suite.result }}
          MOD: ${{ needs.mod.result }}
          KERNEL: ${{ needs.kernel.result }}
        run: |
          echo "suite: $SUITE, mod: $MOD, kernel: $KERNEL"
          [ "$SUITE" = success ] && [ "$MOD" = success ] && [ "$KERNEL" = success ]
