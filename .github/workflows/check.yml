# Runs the whole suite on every push to main and every pull request: `python3 -m unittest`
# (tests/test_docs.py included), then `claude plugin validate mod && claude plugin test mod`
# against the Claude Code version the mod was last verified with, on Python 3.11 (the floor). nightly.yml runs the same on
# the newest Claude Code. The README shows both as badges.
#
# The real-OpenCode tests run against the OpenCode pinned below (OPENCODE_VERSION, installed from
# its release with the hash pinned here); opencode.yml runs them on the newest OpenCode. The Lane
# tests skip where the kernel has no Landlock: the "Landlock" step says which this runner was.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # never on main: shields.io's badge reads a cancelled run as failing, and two merges a minute
  # apart cancelled the first one's (2026-11-19)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Claude Code the mod was last verified with; the floor is in ARCHITECTURE.md, *The tests*.
      CLAUDE_CODE_VERSION: '2.1.311'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
      # The OpenCode the real-OpenCode tests were last verified with, and its release tarball's hash.
      OPENCODE_VERSION: '2.3.0'
      OPENCODE_SHA256: 'fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Standard library only. The floor, 3.11, not the runner's newer python3: a 3.12+ API would
      # pass on the developers' 3.14 and break 3.11 users (the 2026-11-16 audit). nightly.yml runs
      # the runner's own python3, and macOS.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python3 --version
      # The tests' repos carry their own identity; wb accept's commits in a worktree want one too.
      - run: |
          git config --global user.name "workbench CI"
          git config --global user.email "ci@invalid"
      - run: scripts/install-opencode.sh "$OPENCODE_VERSION" "$OPENCODE_SHA256" >> "$GITHUB_PATH"
      # The Git LFS test (#382) skips without git-lfs; the runner image has it, else apt does.
      - name: Git LFS
        run: |
          git lfs version || { sudo apt-get update -q && sudo apt-get install -yq git-lfs && git lfs version; }
      - name: Landlock
        run: |
          python3 -c 'from workbench import lane; print("Landlock ABI", lane.abi() or "none here: the Lane tests skip")'
      - run: python3 -m unittest
      - run: npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
      - run: claude --version
      - run: claude plugin validate mod && claude plugin test mod
