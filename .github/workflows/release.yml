# Tags and releases each new version once it is on main: scripts/release.sh (2026-11-17). Users
# don't install from tags (the marketplace follows main, and their copies move when the version
# does: scripts/check-version.sh), so this is the record: one tag and one GitHub release per
# version, with GitHub's notes from the pull requests since the last one.
#
# On every push to main, daily (a merge armed with GitHub Actions' own token starts no push
# workflow, see owner-merge.yml) and by hand. A version that already has its tag does nothing.

name: release

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:

# Creating a tag and a release is a write; nothing from a pull request runs here, only main.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the commit that first carried the version
      - run: scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
