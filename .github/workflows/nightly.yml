# Runs check.yml's suite once a day on the newest Claude Code. The mod API can change between
# releases, so a red run here means "a new Claude Code broke the mod", not "main is broken":
# check.yml is the one pinned to the version the mod was last verified with. The README shows
# this run's status as a badge.
#
# What a runner can't do skips, not passes: the RealOpenCode tests (no `opencode` on PATH) and the
# Lane tests where the kernel has no Landlock. CLAUDE.md says where those must still be run.

name: nightly

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Always the newest release.
      CLAUDE_CODE_VERSION: latest
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Standard library only: the runner's own python3 (3.11+) is all the suite needs.
      - run: python3 --version
      # The tests' repos carry their own identity; wb accept's commits in a worktree want one too.
      - run: |
          git config --global user.name "workbench CI"
          git config --global user.email "ci@invalid"
      - run: python3 -m unittest
      - run: npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
      - run: claude --version
      - run: claude plugin validate mod && claude plugin test mod
