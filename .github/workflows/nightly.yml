# Runs check.yml's suite once a day on the newest Claude Code. The mod API can change between
# releases, so a red run here means "a new Claude Code broke the mod", not "main is broken":
# check.yml is the one pinned to the version the mod was last verified with. The README shows
# this run's status as a badge. Its `macos` job runs the Python suite on macOS (no /proc, no
# inotify, no Landlock), which the badge says workbench runs on; it may fail without turning the
# run red (continue-on-error), so look at it before a release (the 2026-11-16 audit).
#
# The real-OpenCode tests run against the OpenCode pinned below (OPENCODE_VERSION, installed from
# its release with the hash pinned here); opencode.yml runs them on the newest OpenCode. The Lane
# tests skip where the kernel has no Landlock: the "Landlock" step says which this runner was.

name: nightly

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Always the newest release.
      CLAUDE_CODE_VERSION: latest
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
      # The OpenCode the real-OpenCode tests were last verified with, and its release tarball's hash.
      OPENCODE_VERSION: '2.3.0'
      OPENCODE_SHA256: 'fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Standard library only: the runner's own python3, newer than check.yml's 3.11.
      - run: python3 --version
      # The tests' repos carry their own identity; wb accept's commits in a worktree want one too.
      - run: |
          git config --global user.name "workbench CI"
          git config --global user.email "ci@invalid"
      - run: scripts/install-opencode.sh "$OPENCODE_VERSION" "$OPENCODE_SHA256" >> "$GITHUB_PATH"
      - name: Landlock
        run: |
          python3 -c 'from workbench import lane; print("Landlock ABI", lane.abi() or "none here: the Lane tests skip")'
      - run: python3 -m unittest
      - run: npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
      - run: claude --version
      - run: claude plugin validate mod && claude plugin test mod

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python3 --version
      - run: |
          git config --global user.name "workbench CI"
          git config --global user.email "ci@invalid"
      - run: python3 -m unittest
